services:
  - type: web
    name: chatbot-ui-external-store
    env: docker
    plan: free
    region: oregon
    autoDeploy: true
    dockerfilePath: Dockerfile
    envVars:
      - key: NEXT_PUBLIC_FASTAPI_URL
        value: https://your-backend.example.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
